{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 text-center">
            <div class="mb-4">
                <i class="bi bi-exclamation-diamond-fill text-warning" style="font-size:4rem;"></i>
            </div>
            <h1 class="fw-bold mb-2">400 — Bad Request</h1>
            <p class="text-muted mb-4">
                We could not understand that request. It may have expired, or the form was
                submitted with missing or malformed data.
            </p>
            <div class="d-flex flex-wrap gap-2 justify-content-center">
                <a href="{% url 'core:home' %}" class="btn btn-hb-green rounded-pill px-4">
                    <i class="bi bi-house-door"></i> Back to Home
                </a>
                <a href="{% url 'services:list' %}" class="btn btn-outline-dark rounded-pill px-4">
                    Browse Services
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
