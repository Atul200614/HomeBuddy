{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="rounded-pill bg-success bg-opacity-10 text-success px-3 py-1 fw-bold small">ACCOUNT RECOVERY</span>
                    <h2 class="fw-bold mt-2">Reset Password</h2>
                    <p class="text-muted small">Enter the email associated with your HomeBuddy account to receive reset instructions.</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Your Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                    </div>

                    <button type="submit" class="btn btn-hb-green w-100 py-2 mb-3">
                        <i class="bi bi-envelope-check-fill me-1"></i> Send Reset Link
                    </button>
                    
                    <div class="text-center">
                        <a href="{% url 'accounts:login' %}" class="btn btn-link text-decoration-none text-muted small">
                            <i class="bi bi-arrow-left me-1"></i> Return to Sign In
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
