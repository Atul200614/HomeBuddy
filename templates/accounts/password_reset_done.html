{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 text-center">
                <div class="rounded-circle bg-success bg-opacity-10 text-success d-flex align-items-center justify-content-center mx-auto mb-3" style="width:70px; height:70px; font-size:2rem;">
                    <i class="bi bi-envelope-check"></i>
                </div>
                <h3 class="fw-bold mb-2">Check Your Email</h3>
                <p class="text-muted small mb-4">
                    If an account matches the email provided, reset instructions have been dispatched. Follow the link in the message to set a new password.
                </p>
                <a href="{% url 'accounts:login' %}" class="btn btn-hb-green rounded-pill px-4 py-2 w-100">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Return to Sign In
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
